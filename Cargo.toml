#cargo-features = ["per-package-target"]

[workspace]
members = ["analysis"]
default-members = ["analysis"]

[package]
name = "steamhook"
version = "0.0.1"
authors = ["tremwil <tremwil@users.noreply.github.com>"]
edition = "2021"
license = "MIT"
description = "Hooking internal Steam APIs made easy"
repository = "https://github.com/tremwil/steamhook"
readme = "README.md"
keywords = ["steam", "steamworks", "detour", "hooking", "windows"]
#forced_target = "i686-windows-pc-msvc"

[dependencies]
pelite = { git = "https://github.com/tremwil/pelite", branch = "pe32-aslr-fix" }

[dependencies.windows]
version = "0.59.0"
features = [
    "Data_Xml_Dom",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel"
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false